<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }}{% else %}John Christian William McKinley LaTeX Archive{% endif %}</title>
    <meta name="author" content="John C. W. McKinley">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    {% if page.noindex %}
    <meta name="robots" content="noindex,follow">
    {% else %}
    <meta name="robots" content="index,follow">
    {% endif %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <script type="text/javascript" async src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
    <style>
      .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 45px; }
      @media (max-width: 767px) { .markdown-body { padding: 15px; } }
      .archive-nav { margin: 0 0 24px 0; font-size: 0.95rem; }
      details { background: #f6f8fa; padding: 10px; border-radius: 6px; border: 1px solid #d0d7de; }
      summary { cursor: pointer; font-weight: bold; }
    </style>
  </head>
  <body>
    <article class="markdown-body">
      {% if page.paper %}
      <p class="archive-nav"><a href="{{ '/' | relative_url }}">← Back to the LaTeX Archive</a></p>
      {% endif %}
      {{ content }}
    </article>
  </body>
</html>
